; A phone registered on local account 2001.
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[phone2001-auth]
type=auth
auth_type=userpass
username=2001
password=Ph0ne-2001-pass

[phone2001-reg]
type=registration
transport=transport-udp
outbound_auth=phone2001-auth
server_uri=sip:172.31.252.11:5060
client_uri=sip:2001@172.31.252.11
contact_user=2001
retry_interval=5
expiration=120

; Calls from the phone to our Asterisk, and our calls to the phone.
[ours]
type=endpoint
context=answer
disallow=all
allow=alaw
aors=ours
outbound_auth=phone2001-auth
from_user=2001

[ours]
type=aor
contact=sip:172.31.252.11:5060

[ours]
type=identify
endpoint=ours
match=172.31.252.11
