; CDRs go to their own database (CDR_DATABASE, default cdr) through the "cdr"
; ODBC connection configured by entrypoint.sh.
;
; cdr_adaptive_odbc writes every column of the table whose name matches a CDR
; field or a CDR variable, so the dialplan fills the billing columns with
; Set(CDR(tenant_id)=...), CDR(agent_id), CDR(direction) and CDR(trunk).
[cdr]
connection=cdr
table=cdr
alias start => calldate
usegmtime=no
