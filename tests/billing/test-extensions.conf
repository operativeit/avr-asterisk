; Dialplan like elokia-infra's, with the CDR tags avr-rate needs:
; direction and trunks here, tenant_id / agent_id from provision.

[avr]
exten => _[0-9a-f].,1,NoOp(AVR agent ${EXTEN})
 same => n,Answer()
 same => n,Wait(2)
 same => n,Hangup()

[internal]
switch => Realtime/@
; The agent of the transfer test (no DDI creates it).
exten => aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa,1,Goto(avr,${EXTEN},1)

[incoming]
switch => Realtime/@
; A call the agent transfers out: the agent answers, hangs up, and the
; caller is sent to an outside number (what avr does with a transfer).
exten => 34968000003,1,Set(CDR(tenant_id)=11111111-1111-1111-1111-111111111111)
 same => n,Set(CDR(agent_id)=aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa)
 same => n,Dial(local/aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa@internal,10,g)
 same => n,Set(CDR(direction)=out)
 same => n,Goto(outgoing,34600111222,1)

[from-phones]
exten => _X.,1,ExecIf($["${TENANT_ID}" != ""]?Set(CDR(tenant_id)=${TENANT_ID}))
 same => n,ExecIf($["${AGENT_ID}" != ""]?Set(CDR(agent_id)=${AGENT_ID}))
 same => n,GotoIf($[${DIALPLAN_EXISTS(internal,${EXTEN},1)}]?internal)
 same => n,Set(CDR(direction)=out)
 same => n,Goto(outgoing,${EXTEN},1)
 same => n(internal),Set(CDR(direction)=internal)
 same => n,Goto(internal,${EXTEN},1)

[from-trunk]
exten => _X.,1,Set(CDR(direction)=in)
 same => n,Set(CDR(source_trunk)=${CHANNEL(endpoint)})
 same => n,GotoIf($[${DIALPLAN_EXISTS(incoming,${EXTEN},1)}]?known-did)
 same => n,Hangup()
 same => n(known-did),Goto(incoming,${EXTEN},1)

[outgoing]
; National numbers become E.164, so dst (the rated number) is always E.164.
exten => _[6-9]XXXXXXXX,1,Goto(outgoing,34${EXTEN},1)
exten => _34X.,1,Set(CDR(destination_trunk)=carrier1)
 same => n,Dial(PJSIP/${EXTEN}@carrier1,10)

[start-recording-on-answer]
exten => s,1,Return()
