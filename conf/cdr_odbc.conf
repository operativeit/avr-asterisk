; CDRs go to their own database (CDR_DATABASE, default cdr) through the "cdr"
; ODBC connection configured by entrypoint.sh. cdr_odbc is the ODBC backend
; built into this image (cdr_adaptive_odbc is disabled in menuselect).
[global]
dsn=cdr
table=cdr
loguniqueid=yes
dispositionstring=yes
usegmtime=no
newcdrcolumns=no
