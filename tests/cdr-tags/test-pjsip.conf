; The accounts the test calls use, written as elokia-provision would create
; them in the realtime tables (contexts, set_var tags), but static: this image
; no longer ships the provision schema.
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; Phone 2001 of tenant 1 (registers from the phone container).
[2001]
type=endpoint
context=from-phones
disallow=all
allow=alaw
auth=2001
aors=2001
set_var=__TENANT_ID=11111111-1111-1111-1111-111111111111

[2001]
type=auth
auth_type=userpass
username=2001
password=Ph0ne-2001-pass

[2001]
type=aor
max_contacts=1

; Account 2002 of tenant 1, bound to agent A1.
[2002]
type=endpoint
context=from-phones
disallow=all
allow=alaw
aors=2002
set_var=__TENANT_ID=11111111-1111-1111-1111-111111111111
set_var=__AGENT_ID=aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa

[2002]
type=aor
max_contacts=1

; The carrier trunk, identified by its address.
[carrier1]
type=endpoint
context=from-trunk
disallow=all
allow=alaw
aors=carrier1

[carrier1]
type=aor
contact=sip:172.31.252.14:5060

[carrier1]
type=identify
endpoint=carrier1
match=172.31.252.14
