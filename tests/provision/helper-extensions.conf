; Pre-dial handler adding the header Meta puts on WhatsApp calls.
[add-wa-header]
exten => s,1,Set(PJSIP_HEADER(add,X-FB-External-Domain)=wa.meta.vc)
 same => n,Return()

; Call our Asterisk the way Meta does (used by run.sh from the meta helper).
[call-wa]
exten => wa,1,Dial(PJSIP/+34968000678@ours,5,b(add-wa-header^s^1))
