; The carrier: sends DDI calls to us and answers our outgoing calls.
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[ours]
type=endpoint
context=answer
disallow=all
allow=alaw
aors=ours

[ours]
type=aor
contact=sip:172.31.252.11:5060

[ours]
type=identify
endpoint=ours
match=172.31.252.11
