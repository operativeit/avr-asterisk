# Test environment for CDR tagging and rating (see run.sh): MySQL, the image
# built from this repository, a phone and a carrier (published image).
name: avr-asterisk-billing-test

x-helper: &helper
  image: operativeit/avr-asterisk
  environment:
    - DB_MIGRATE=no

x-env: &env
  - MYSQL_HOST=avr-asterisk-db
  - MYSQL_PORT=3306
  - MYSQL_DATABASE=asterisk
  - MYSQL_USER=asterisk
  - MYSQL_PASSWORD=Ap9!%*+-.^_~pass
  - MYSQL_ROOT_PASSWORD=Rt7!%*+-.^_~root

services:
  avr-asterisk-db:
    image: mysql:8.0.15
    platform: linux/x86_64
    command: mysqld --default-authentication-plugin=mysql_native_password --event-scheduler=ON
    environment:
      - MYSQL_DATABASE=asterisk
      - MYSQL_USER=asterisk
      - MYSQL_PASSWORD=Ap9!%*+-.^_~pass
      - MYSQL_ROOT_PASSWORD=Rt7!%*+-.^_~root
    volumes:
      - ./empty-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 3s
      retries: 40
    networks:
      net: { ipv4_address: 172.31.252.10 }

  avr-asterisk:
    build: ../..
    image: avr-asterisk:billing-test
    command: ["asterisk", "-f", "-vvv"]
    depends_on:
      avr-asterisk-db: { condition: service_healthy }
    environment: *env
    volumes:
      - ./test-pjsip.conf:/etc/asterisk/my_pjsip.conf:ro
      - ./test-extensions.conf:/etc/asterisk/my_extensions.conf:ro
      - ./helper-extensions.d:/etc/asterisk/extensions.d:ro
    networks:
      net: { ipv4_address: 172.31.252.11 }

  phone:
    <<: *helper
    volumes:
      - ./phone.conf:/etc/asterisk/my_pjsip.conf:ro
      - ./helper-sorcery.conf:/etc/asterisk/my_sorcery.conf:ro
      - ./helper-extensions.conf:/etc/asterisk/my_extensions.conf:ro
      - ./helper-extensions.d:/etc/asterisk/extensions.d:ro
    networks:
      net: { ipv4_address: 172.31.252.12 }

  carrier:
    <<: *helper
    volumes:
      - ./carrier.conf:/etc/asterisk/my_pjsip.conf:ro
      - ./helper-sorcery.conf:/etc/asterisk/my_sorcery.conf:ro
      - ./helper-extensions.conf:/etc/asterisk/my_extensions.conf:ro
      - ./helper-extensions.d:/etc/asterisk/extensions.d:ro
    networks:
      net: { ipv4_address: 172.31.252.14 }

networks:
  net:
    ipam:
      config:
        - subnet: 172.31.252.0/24
