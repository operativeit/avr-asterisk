; Minimal dialplan with the contexts provision writes to or relies on.
[avr]
exten => _[0-9a-f].,1,NoOp(AVR agent ${EXTEN} at ${ARG1})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Hangup()

[internal]
switch => Realtime/@

[incoming]
switch => Realtime/@

[from-phones]
exten => _X.,1,GotoIf($[${DIALPLAN_EXISTS(internal,${EXTEN},1)}]?internal,${EXTEN},1)
 same => n,Hangup()

[from-trunk]
exten => _X.,1,GotoIf($[${DIALPLAN_EXISTS(incoming,${EXTEN},1)}]?known-did)
 same => n,Hangup()
 same => n(known-did),Set(UUID=${SHELL(uuidgen | tr -d '\n')})
 same => n,Goto(incoming,${EXTEN},1)

[from-whatsapp]
exten => _+X.,1,GotoIf($[${DIALPLAN_EXISTS(incoming,${EXTEN},1)}]?known-did)
 same => n,Hangup()
 same => n(known-did),Set(UUID=${SHELL(uuidgen | tr -d '\n')})
 same => n,Goto(incoming,${EXTEN},1)

[start-recording-on-answer]
exten => s,1,Return()
