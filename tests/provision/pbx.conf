[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; Non-standard ports, as remote PBXs often use.
[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5062

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5063
cert_file=/etc/asterisk/keys/asterisk.crt
priv_key_file=/etc/asterisk/keys/asterisk.key
method=tlsv1_2

; Extensions of the remote PBX used by our external accounts: 128 over UDP 5060,
; 129 over TCP 5062, 130 over TLS 5063.
[ext128]
type=endpoint
context=default
disallow=all
allow=alaw
auth=ext128-auth
aors=ext128

[ext128-auth]
type=auth
auth_type=userpass
username=ext128
password=pbxpass128

[ext128]
type=aor
max_contacts=1

[ext129]
type=endpoint
context=default
disallow=all
allow=alaw
auth=ext129-auth
aors=ext129

[ext129-auth]
type=auth
auth_type=userpass
username=ext129
password=pbxpass129

[ext129]
type=aor
max_contacts=1

[ext130]
type=endpoint
context=default
disallow=all
allow=alaw
auth=ext130-auth
aors=ext130

[ext130-auth]
type=auth
auth_type=userpass
username=ext130
password=pbxpass130

[ext130]
type=aor
max_contacts=1
