[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; 2001 and 2005 over UDP, 2002 over TCP (passwords are written by run.sh)
[phone2001-auth]
type=auth
auth_type=userpass
username=2001
password=phonepass2001

[phone2001-reg]
type=registration
transport=transport-udp
outbound_auth=phone2001-auth
server_uri=sip:172.31.251.11:5060
client_uri=sip:2001@172.31.251.11
contact_user=2001
retry_interval=5
expiration=120

[phone2002-auth]
type=auth
auth_type=userpass
username=2002
password=phonepass2002

[phone2002-reg]
type=registration
transport=transport-tcp
outbound_auth=phone2002-auth
server_uri=sip:172.31.251.11:5060;transport=tcp
client_uri=sip:2002@172.31.251.11;transport=tcp
contact_user=2002
retry_interval=5
expiration=120

[phone2005-auth]
type=auth
auth_type=userpass
username=2005
password=phonepass2005

[phone2005-reg]
type=registration
transport=transport-udp
outbound_auth=phone2005-auth
server_uri=sip:172.31.251.11:5060
client_uri=sip:2005@172.31.251.11
contact_user=2005
retry_interval=5
expiration=120

; Calls from the phone to our Asterisk, as 2001.
[ours]
type=endpoint
context=default
disallow=all
allow=alaw,ulaw
aors=ours
outbound_auth=phone2001-auth
from_user=2001

[ours]
type=aor
contact=sip:172.31.251.11:5060

[ours]
type=identify
endpoint=ours
match=172.31.251.11
